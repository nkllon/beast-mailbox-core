version: "3.8"

services:
  pushgateway:
    image: prom/pushgateway:latest
    container_name: prometheus-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - pushgateway_data:/var/lib/pushgateway
    command:
      - "--persistence.file=/var/lib/pushgateway/pushgateway.db"
      - "--persistence.interval=5m"

volumes:
  pushgateway_data:
