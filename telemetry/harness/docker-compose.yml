version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: telemetry-harness-prometheus
    restart: unless-stopped
    ports:
      - "20090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: telemetry-harness-grafana
    restart: unless-stopped
    ports:
      - "20300:3000"
    environment:
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - grafana_data:/var/lib/grafana

  pushgateway:
    image: prom/pushgateway:latest
    container_name: telemetry-harness-pushgateway
    restart: unless-stopped
    ports:
      - "20637:9091"
    volumes:
      - pushgateway_data:/var/lib/pushgateway
    command:
      - "--persistence.file=/var/lib/pushgateway/pushgateway.db"
      - "--persistence.interval=1m"

volumes:
  prometheus_data:
  grafana_data:
  pushgateway_data:
