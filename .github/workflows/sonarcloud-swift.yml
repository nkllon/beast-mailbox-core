name: SonarCloud Analysis - Swift

on:
  push:
    branches:
      - main
      - docs/add-agent-maintainer-guide
    paths:
      - 'observatory/swift/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'observatory/swift/**'
  release:
    types: [published]

jobs:
  sonarcloud-swift:
    name: SonarCloud Swift Analysis
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
          # Explicitly checkout release tag for release events (not main branch)
          ref: ${{ github.event.release.tag_name || github.ref }}
      
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"  # Match Package.swift swift-tools-version
      
      - name: Clean build artifacts
        working-directory: observatory/swift
        run: |
          # Clean Swift Package Manager build cache
          rm -rf .build
          rm -rf .swiftpm
          # Clean Xcode build artifacts
          rm -rf ~/Library/Developer/Xcode/DerivedData
      
      - name: Check project type and build
        working-directory: observatory/swift
        run: |
          if [ -f "Package.swift" ]; then
            echo "Building with Swift Package Manager..."
            swift build
          elif [ -f "project.yml" ] && [ -d "ObservatoryApp.xcodeproj" ]; then
            echo "Building Xcode project with xcodebuild..."
            xcodebuild -project ObservatoryApp.xcodeproj \
              -scheme ObservatoryApp \
              -configuration Release \
              -derivedDataPath ./DerivedData \
              clean build
          else
            echo "⚠️  No Package.swift or Xcode project found, skipping build"
            exit 1
          fi
      
      - name: Run Tests
        working-directory: observatory/swift
        run: |
          if [ -f "Package.swift" ]; then
            swift test
          elif [ -f "project.yml" ] && [ -d "ObservatoryApp.xcodeproj" ]; then
            xcodebuild -project ObservatoryApp.xcodeproj \
              -scheme ObservatoryApp \
              -configuration Release \
              -derivedDataPath ./DerivedData \
              test
          else
            echo "⚠️  No Package.swift or Xcode project found, skipping tests"
            exit 1
          fi
      
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: observatory/swift

